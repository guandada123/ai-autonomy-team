name: selftest

# D-0046：最小 CI —— 只回答一个问题「只拿这个仓库，东西能跑吗」。
# 它不发布、不部署、不接任何 secret；推前拦截仍由本地 git 钩子负责
# （verify_handover 第 6 项检查钩子是否已装）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    # 固定版本而非 ubuntu-latest：浮动镜像会让「哪天开始红的」不可归因
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      # 不生成 __pycache__：门禁 D 项会数包内文件，缓存属交付卫生问题
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: 检出
        # 固定 commit SHA（v4.2.2），不用浮动 tag —— tag 漂移会静默改变结论
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # 必须是完整历史：默认 --depth 1 的浅克隆里 `git bundle create --all`
          # 产出不可还原的包，备份自检会红（2026-10-23 首跑即因此失败，D-0046）
          fetch-depth: 0

      - name: 环境自述
        run: |
          python3 --version
          git --version
          make --version | head -1

      - name: 全量自检（脚本自检 + A–H 门禁 + 56 项回归）
        run: make selftest

      - name: ruff lint 门槛（版本固定，规则见 pyproject [tool.ruff.lint]）
        # 独立步骤而非 A–H 第 9 项：ruff 是第三方包，放进门禁会让「干净环境全过」破产
        # （与下方 coverage 同一理由，2026-10-23 的教训）。
        # 版本写死：浮动 ruff 会在某天静默新增规则，让「哪天开始红的」不可归因。
        # 历史：本项目 pyproject 早在 2026-10-23 就配了 ruff，但 CI 一直没跑 ——
        # 配置在睡觉，既红又没人看见（本次接入时存量 6 处，全部可自动修）。
        run: |
          python3 -m venv /tmp/lint-venv
          /tmp/lint-venv/bin/pip install -q ruff==0.15.17
          echo "ruff $(/tmp/lint-venv/bin/ruff --version)"
          /tmp/lint-venv/bin/ruff check . --output-format=concise

      - name: 覆盖率 ratchet 门槛（基线见 tools/coverage-baseline.txt）
        # 独立步骤而非 A–H 第 9 项：coverage 需要装第三方包，放门禁里会让
        # 「干净环境全过」的承诺破产（H 项 2026-10-23 的教训）。ratchet 只许上不许下。
        run: |
          python3 -m venv /tmp/cov-venv
          /tmp/cov-venv/bin/pip install -q coverage
          ./tools/coverage_run.sh > /tmp/cov.log 2>&1 || { tail -30 /tmp/cov.log; exit 1; }
          PCT=$(awk '$1=="TOTAL"{gsub(/%/,"",$4); print $4}' /tmp/cov.log)
          ./tools/coverage_gate.sh "$PCT"
