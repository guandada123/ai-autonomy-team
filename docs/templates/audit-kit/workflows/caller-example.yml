name: CI (caller)

# ⚠️ 示例文件：演示下游仓库如何调用 reusable workflow quality-gate.yml。
# 本仓库为纯工具/文档库（无 .py/.js/.php 应用代码），示例强制全开检查，
# 若随 push/PR 自动执行必然红灯（gitleaks 全历史扫描等）→ 仅保留 workflow_dispatch
# 手动演示能力，不作为本仓库的自动 CI 门禁（真实门禁见 eak-ci.yml）。
on:
  workflow_dispatch:

jobs:
  quality-gate:
    # ⚠️ 版本铁律：只能用「已验证合法」的 tag —— v2 是坏版本（YAML 非法，见 README）。
    # 2026-11-01 同步：原快照 pin v3，已齐到 v8（v4-v8 修了 pytest 假绿灯、加了 run-pytest 委托、
    # 并把 bandit / npm audit 的吞错改成真闸门）。
    uses: guandada123/engineering-audit-kit/.github/workflows/quality-gate.yml@v8
    with:
      node-version: '20'
      run-eslint: true
      run-prettier: true
      run-php: auto
      run-python: auto
      run-pytest: auto
      npm-audit-level: high
    secrets: inherit
