# 本项目（ai-autonomy-team）gitleaks 配置
# 来源：engineering-audit-kit 模板（2026-11-01 导入），2026-11-02 按本仓库实际误报修正。
# Reference: https://github.com/gitleaks/gitleaks#config
title = "ai-autonomy-team Secret Scan"

# ── allowlist：只排除「扫描器自指」与「非源码缓存」两类误报 ──────────────────
# 2026-11-02 实测：本仓库首跑命中 5 处（当前 4 + 历史 1），**全部是误报**，
# 且模式完全一致——密钥扫描脚本自己的源码里写着 -----BEGIN ... PRIVATE KEY-----
# 这个**模式字符串**，于是被自己的规则命中（Secret 长度仅 8 字符，是正则片段）。
#   当前: _trash/.../pre_push_scan.py:49、scripts/__pycache__/pre_push_scan.pyc ×3
#   历史: snapshots/20261023-.../pre_push_scan.py:49 (commit 038146c0)
#
# 刻意**不**排除 snapshots/、migration-package/ 等业务目录：那里若真混进凭据，
# 正是要抓的对象。排除面每多一条，检出率就少一块——只排必要的两类：
#   ① pre_push_scan.py：密钥检测器本体，必然包含密钥模式（排除它=排除"扫描器自指"）
#   ② __pycache__/、_trash/：编译缓存与已归档目录，均未被 git 跟踪，扫它们只是噪声
[allowlist]
  description = "排除扫描器自指（检测器源码含密钥模式）与非源码缓存；不排除业务目录"
  paths = [
    '''(^|/)pre_push_scan\.py$''',
    '''(^|/)__pycache__/''',
    '''^_trash/''',
  ]
  regexes = [
    '(?i)password[\s=:]*example',
    '(?i)secret[\s=:]*placeholder',
    '-----BEGIN PUBLIC KEY-----',
  ]

# ── 规则：模板原有三条，未改动（阈值与 entropy 均沿用上游默认） ────────────
# 注意 generic-api-key 的 entropy=4.0 是"高熵"判据：本仓库当前 0 误报，
# 若日后误报集中在它身上，优先调 entropy 而不是关掉规则（关掉=裸奔）。
[[rules]]
  id = "generic-api-key"
  description = "High entropy string likely API key"
  regex = '''(?i)(api[_-]?key|access[_-]?key|secret|token)[\s=:'"]*[A-Za-z0-9\-_]{20,}'''
  entropy = 4.0
  tags = ["key", "api", "token"]

[[rules]]
  id = "aws-key"
  description = "AWS Access Key"
  regex = '''AKIA[0-9A-Z]{16}'''
  tags = ["aws"]

[[rules]]
  id = "private-key"
  description = "Private Key"
  regex = '''-----BEGIN (EC|RSA|DSA|OPENSSH) PRIVATE KEY-----'''
  tags = ["key", "private"]
