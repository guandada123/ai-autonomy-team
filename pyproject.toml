# 本项目是「脚本集」而非可安装库：所有入口都以 `python3 scripts/<name>.py` 直接运行，
# 没有 console_scripts，也没有需要 pip install 的包。
# 因此这里**刻意不定义 [project] / [build-system]** —— 定义了就会变成"能 pip install
# 但装完不可用"的空包，比不定义更误导。
#
# 项目元数据见 README.md（目标、范围、模块划分）与 VERSION。
# 依赖见 DEPENDENCIES.md：零第三方依赖，只用 Python 标准库。

# ── ruff ──────────────────────────────────────────────────────────────
# 与 Claw 项目同一套工具，便于两个项目之间搬代码时行为一致。
[tool.ruff]
target-version = "py39"
line-length = 100          # 只对 `ruff format` 生效；check 阶段不查行长
exclude = [
    "_trash",
    "_archive",
    "snapshots",           # 快照是历史副本，不该当源码检查（2026-10-23 审计补）
    "migration-package/runs",
    "__pycache__",
]

[tool.ruff.lint]
# 只开「真错误」，不开风格类。
#
# 2026-10-23 审计修正：初版开了 E/W/I/UP/B/C4/SIM/ARG/PTH 十组，落地即红 472 个
# （scripts 122 + snapshots 278 + 其余 72），而项目里没有任何地方执行 ruff ——
# 于是它既是红的、又没人看见，只能让下一个人误以为"规范已就位"。
#
# 判断：对一个 12,574 行、已稳定跑过 33 轮的存量项目，风格类规则（UP 现代化 /
# PTH pathlib 化 / ARG 未用参数）大面积命中是必然的，收益远小于噪音。
# 先让 `ruff check` 能绿，这份配置才有资格被称作规范；风格类等接了 CI 再逐步加。
#
# 2026-11-01：CI 已接入 ruff（selftest.yml 独立步骤，版本固定 0.15.17），本地用 `make lint`。
# 接入时存量 6 处（3 未用 import + 3 无占位符 f-string），已全部自动修掉。
# 规则集仍只开 F+E9 —— 扩容风格类属另一件事，需单独评估噪音比。
#
# F  = Pyflakes（未定义名、未使用 import、重复定义…，都是真错误）
# E9 = 语法错误
select = ["F", "E9"]
