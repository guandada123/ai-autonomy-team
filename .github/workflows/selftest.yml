name: selftest

# D-0046：最小 CI —— 只回答一个问题「只拿这个仓库，东西能跑吗」。
# 它不发布、不部署、不接任何 secret；推前拦截仍由本地 git 钩子负责
# （verify_handover 第 6 项检查钩子是否已装）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    # 2026-11-23 换本机 self-hosted：本仓是私有仓，hosted runner 吃私有分钟额度，
    # 计费未通过时 job 直接 steps=0 不启动（annotation 原文 "recent account payments
    # have failed or your spending limit needs to be increased"）——11-20 起 4 次 run
    # 全部如此，等于这个仓从未真正验证过。改用本机 runner（与 Claw 同一台、同一标签），零成本。
    # 代价：机器关机/runner 服务停了就不跑；靠本机可用性，不再依赖 GitHub 侧额度。
    runs-on: [self-hosted, mac-local]
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      # 不生成 __pycache__：门禁 D 项会数包内文件，缓存属交付卫生问题
      PYTHONDONTWRITEBYTECODE: "1"
      # 与 ~/actions-runner-autonomy/.env 一致；自带工具缓存，别与 Claw 的 _work 混用
      RUNNER_TOOL_CACHE: /Users/guan/actions-runner-autonomy/_work/_tool
      AGENT_TOOLSDIRECTORY: /Users/guan/actions-runner-autonomy/_work/_tool
    steps:
      - name: 检出
        # 固定 commit SHA（v4.2.2），不用浮动 tag —— tag 漂移会静默改变结论
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # 必须是完整历史：默认 --depth 1 的浅克隆里 `git bundle create --all`
          # 产出不可还原的包，备份自检会红（2026-10-23 首跑即因此失败，D-0046）
          fetch-depth: 0

      - name: 固定 Python
        # 换成 self-hosted 后必须显式装 Python：macOS 自带的 /usr/bin/python3 是 3.9，
        # 而本项目声明 target-version=py39 却用了 3.10+ API（Path.write_text(newline=)），
        # 3.9 下 audit/kit 自检会红 2 项 —— 那是「声明与实现不符」的独立问题，
        # 不该借换 runner 混进本次变更里。这里钉 3.12（原 ubuntu-24.04 默认版本），
        # 保证「换执行位置、不换验证口径」。
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 环境自述
        run: |
          python3 --version
          git --version
          make --version | head -1

      - name: 全量自检（脚本自检 + A–H 门禁 + 56 项回归）
        run: make selftest

      - name: ruff lint 门槛（版本固定，规则见 pyproject [tool.ruff.lint]）
        # 独立步骤而非 A–H 第 9 项：ruff 是第三方包，放进门禁会让「干净环境全过」破产
        # （与下方 coverage 同一理由，2026-10-23 的教训）。
        # 版本写死：浮动 ruff 会在某天静默新增规则，让「哪天开始红的」不可归因。
        # 历史：本项目 pyproject 早在 2026-10-23 就配了 ruff，但 CI 一直没跑 ——
        # 配置在睡觉，既红又没人看见（本次接入时存量 6 处，全部可自动修）。
        run: |
          python3 -m venv /tmp/lint-venv
          /tmp/lint-venv/bin/pip install -q ruff==0.15.17
          echo "ruff $(/tmp/lint-venv/bin/ruff --version)"
          /tmp/lint-venv/bin/ruff check . --output-format=concise

      - name: 覆盖率 ratchet 门槛（基线见 tools/coverage-baseline.txt）
        # 独立步骤而非 A–H 第 9 项：coverage 需要装第三方包，放门禁里会让
        # 「干净环境全过」的承诺破产（H 项 2026-10-23 的教训）。ratchet 只许上不许下。
        run: |
          python3 -m venv /tmp/cov-venv
          /tmp/cov-venv/bin/pip install -q coverage
          ./tools/coverage_run.sh > /tmp/cov.log 2>&1 || { tail -30 /tmp/cov.log; exit 1; }
          PCT=$(awk '$1=="TOTAL"{gsub(/%/,"",$4); print $4}' /tmp/cov.log)
          ./tools/coverage_gate.sh "$PCT"
