name: selftest

# D-0046：最小 CI —— 只回答一个问题「只拿这个仓库，东西能跑吗」。
# 它不发布、不部署、不接任何 secret；推前拦截仍由本地 git 钩子负责
# （verify_handover 第 6 项检查钩子是否已装）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    # 固定版本而非 ubuntu-latest：浮动镜像会让「哪天开始红的」不可归因
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      # 不生成 __pycache__：门禁 D 项会数包内文件，缓存属交付卫生问题
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: 检出
        # 固定 commit SHA（v4.2.2），不用浮动 tag —— tag 漂移会静默改变结论
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: 环境自述
        run: |
          python3 --version
          git --version
          make --version | head -1

      - name: 全量自检（脚本自检 + A–H 门禁 + 50 项回归）
        run: make selftest
